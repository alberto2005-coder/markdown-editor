name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  comprobar:
    name: Comprobar el proyecto
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Descargar el código
        uses: actions/checkout@v4

      - name: 🟢 Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 'latest'
          check-latest: true

      - name: 🔎 Sintaxis de JavaScript
        run: |
          node --check js/app.js
          node --check js/i18n.js

      - name: 🧪 Estructura, rutas, ids, i18n y documentación
        run: node scripts/check.js

      - name: 🌐 El sitio se puede servir
        run: |
          python3 -m http.server 8000 > /dev/null 2>&1 &
          sleep 2
          curl -fsS http://127.0.0.1:8000/index.html     -o /dev/null
          curl -fsS http://127.0.0.1:8000/css/style.css   -o /dev/null
          curl -fsS http://127.0.0.1:8000/js/app.js       -o /dev/null
          curl -fsS http://127.0.0.1:8000/js/i18n.js      -o /dev/null
          curl -fsS http://127.0.0.1:8000/assets/icon.svg -o /dev/null
          echo "Todas las rutas responden correctamente."

      - name: 📦 Subir el proyecto como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: markdown-editor
          path: |
            index.html
            css
            js
            assets
            docs
            README.md
            CHANGELOG.md
            LICENSE
            .nojekyll
