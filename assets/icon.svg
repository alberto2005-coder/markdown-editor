<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Markdown Editor">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="0.5" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1e3a8a" flood-opacity="0.35"/>
    </filter>
    <clipPath id="card">
      <rect x="32" y="32" width="448" height="448" rx="104"/>
    </clipPath>
  </defs>

  <!-- tarjeta redondeada -->
  <g filter="url(#shadow)">
    <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bg)"/>
  </g>

  <g clip-path="url(#card)">
    <!-- brillo superior -->
    <rect x="32" y="32" width="448" height="210" fill="url(#shine)"/>
    <!-- pista de la pantalla partida en dos -->
    <rect x="249" y="32" width="14" height="56" rx="7" fill="#ffffff" opacity="0.5"/>
    <rect x="249" y="424" width="14" height="56" rx="7" fill="#ffffff" opacity="0.5"/>
    <!-- destellos decorativos -->
    <circle cx="418" cy="112" r="9" fill="#ffffff" opacity="0.55"/>
    <circle cx="96" cy="404" r="7" fill="#ffffff" opacity="0.45"/>
  </g>

  <!-- marca Markdown: M + barra + flecha -->
  <g transform="translate(0,-58)">
    <path d="M136 330 V182 L256 292 L376 182 V330"
          fill="none" stroke="#ffffff" stroke-width="34"
          stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="152" y="360" width="208" height="30" rx="15" fill="#ffffff"/>
    <path d="M204 404 L256 448 L308 404"
          fill="none" stroke="#ffffff" stroke-width="30"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
